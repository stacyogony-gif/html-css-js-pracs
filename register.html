<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Create Account</title>
</head>
<body>
    <div class="container">
        <div class="logo">pixel</div>
        <h1>Create Account</h1>
        <p class="subtittle">please fill in the form below to create an account.</p>
          <form action="">
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input type="text="id="fullname" placeholder="enter your fullnames"required>
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email"id="email"name="email" placeholder="enter your email"required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password"id="password"name="password" placeholder="enter your password"required>
            </div>
            <div class="input-group">
                <label for="password"> Confirm Password</label>
                <input type="password"id="confirm password"name="confirm password" placeholder="confirm your password"required>
            </div>
            <div class="terms">
                <input type="checkbox"name="terms"id="terms"required>
                <label for="terms">I agree to the <a href="#">Terms and condition</a></label>
            </div>
            <button type="submit">Create Account</button>
          </form>
          <p class="login">
            Already have an account?
            <a href="#">login here</a>
          </p>
    </div>
</body>
</html>
